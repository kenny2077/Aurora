name: aurora-digest

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Aurora mode to run
        default: unified_digest
        type: choice
        options:
          - tech_news
          - scholar
          - repo_learning
          - unified_digest
          - all
      dry_run:
        description: Run without live sources
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      topic:
        description: Shared repo and research topic
        default: agents_harness
        type: choice
        options:
          - machine_learning
          - agents_harness
          - computer_vision
      skip_llm:
        description: Skip optional LLM enrichment for faster Pages publishing
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  aurora:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install uv
        run: |
          python -m pip install --user "uv==0.11.15"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          uv sync --dev
          npm --prefix web ci
      - name: Restore Aurora state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          STATE_DIR="$(mktemp -d)"
          git -C "$STATE_DIR" init
          git -C "$STATE_DIR" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$STATE_DIR" fetch --depth=1 origin gh-pages; then
            git -C "$STATE_DIR" checkout -B gh-pages FETCH_HEAD
            if [ -f "$STATE_DIR/.aurora/aurora_state.json" ]; then
              mkdir -p data
              cp "$STATE_DIR/.aurora/aurora_state.json" data/aurora_state.json
            fi
            if [ -d "$STATE_DIR/.aurora/content/posts" ]; then
              mkdir -p web/src/content/posts
              cp -R "$STATE_DIR/.aurora/content/posts/." web/src/content/posts/
            fi
          fi
      - name: Validate config
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          AURORA_EMAIL_RECIPIENTS: ${{ secrets.AURORA_EMAIL_RECIPIENTS }}
        run: uv run aurora config validate --config data/actions.config.json
      - name: Check email secrets
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          AURORA_EMAIL_RECIPIENTS: ${{ secrets.AURORA_EMAIL_RECIPIENTS }}
        run: |
          for name in SMTP_USERNAME EMAIL_PASSWORD AURORA_EMAIL_RECIPIENTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required email secret: ${name}"
              exit 1
            fi
          done
      - name: Run Aurora
        timeout-minutes: 25
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          AURORA_EMAIL_RECIPIENTS: ${{ secrets.AURORA_EMAIL_RECIPIENTS }}
        run: |
          CONFIG_PATH="data/actions.config.json"
          MODE="${{ github.event.inputs.mode || 'unified_digest' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          TOPIC="${{ github.event.inputs.topic || 'agents_harness' }}"
          SKIP_LLM="${{ github.event.inputs.skip_llm || 'false' }}"
          if [ "$DRY_RUN" != "true" ] && [ "$SKIP_LLM" != "true" ] && [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Missing required LLM secret: DEEPSEEK_API_KEY"
            exit 1
          fi
          ARGS=(--config "$CONFIG_PATH" --mode "$MODE")
          ARGS+=(--topic "$TOPIC")
          if [ "$SKIP_LLM" = "true" ]; then
            ARGS+=(--skip-llm)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            uv run aurora run --dry-run "${ARGS[@]}"
          else
            uv run aurora run "${ARGS[@]}" --strict-delivery
          fi
      - name: Build Astro Pages site
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm --prefix web run build
      - name: Verify generated Pages site
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          test -s web/dist/index.html
          test -s web/dist/rss.xml
          test -d web/src/content/posts
          POST_COUNT="$(find web/src/content/posts -type f -name '*.md' | wc -l)"
          if [ "$POST_COUNT" -lt 1 ]; then
            echo "No digest posts were generated under web/src/content/posts."
            exit 1
          fi
          if grep -R "No items were available for the unified digest." web/src/content/posts/*.md; then
            echo "Generated digest is empty; refusing to publish an empty Pages update."
            exit 1
          fi
          mkdir -p web/dist/.aurora/content/posts
          cp -R web/src/content/posts/. web/dist/.aurora/content/posts/
          if [ -f data/aurora_state.json ]; then
            mkdir -p web/dist/.aurora
            cp data/aurora_state.json web/dist/.aurora/aurora_state.json
          fi
          touch web/dist/.nojekyll
      - name: Publish gh-pages branch
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLISH_DIR="$(mktemp -d)"
          git -C "$PUBLISH_DIR" init
          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISH_DIR" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$PUBLISH_DIR" fetch --depth=1 origin gh-pages; then
            git -C "$PUBLISH_DIR" checkout -B gh-pages FETCH_HEAD
          else
            git -C "$PUBLISH_DIR" checkout --orphan gh-pages
          fi
          cp -R web/dist/. "$PUBLISH_DIR"/
          git -C "$PUBLISH_DIR" add .
          if git -C "$PUBLISH_DIR" diff --cached --quiet; then
            echo "No Pages changes to publish."
          else
            git -C "$PUBLISH_DIR" commit -m "Publish Aurora site"
            git -C "$PUBLISH_DIR" push origin gh-pages
          fi
