name: aurora-digest

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Aurora mode to run
        default: unified_digest
        type: choice
        options:
          - tech_news
          - scholar
          - repo_learning
          - unified_digest
          - all
      dry_run:
        description: Run without live sources
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_llm:
        description: Skip optional LLM enrichment for faster Pages publishing
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  aurora:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install uv
        run: |
          python -m pip install --user "uv==0.11.15"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install
        run: uv sync --dev
      - name: Validate config
        run: uv run aurora config validate
      - name: Run Aurora
        timeout-minutes: 25
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          AURORA_EMAIL_RECIPIENTS: ${{ secrets.AURORA_EMAIL_RECIPIENTS }}
        run: |
          MODE="${{ github.event.inputs.mode || 'unified_digest' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          SKIP_LLM="${{ github.event.inputs.skip_llm || 'true' }}"
          ARGS=(--mode "$MODE")
          if [ "$SKIP_LLM" = "true" ]; then
            ARGS+=(--skip-llm)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            uv run aurora run --dry-run "${ARGS[@]}"
          else
            uv run aurora run "${ARGS[@]}" --strict-delivery
          fi
      - name: Verify generated Pages site
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          test -s site/index.md
          test -s site/_config.yml
          test -s site/feed.xml
          test -d site/_posts
          POST_COUNT="$(find site/_posts -type f -name '*.md' | wc -l)"
          if [ "$POST_COUNT" -lt 1 ]; then
            echo "No digest posts were generated under site/_posts."
            exit 1
          fi
      - name: Publish gh-pages branch
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLISH_DIR="$(mktemp -d)"
          git -C "$PUBLISH_DIR" init
          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISH_DIR" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$PUBLISH_DIR" fetch --depth=1 origin gh-pages; then
            git -C "$PUBLISH_DIR" checkout -B gh-pages FETCH_HEAD
          else
            git -C "$PUBLISH_DIR" checkout --orphan gh-pages
          fi
          cp -R site/. "$PUBLISH_DIR"/
          if [ -f "$PUBLISH_DIR/.nojekyll" ]; then
            rm "$PUBLISH_DIR/.nojekyll"
          fi
          git -C "$PUBLISH_DIR" add .
          if git -C "$PUBLISH_DIR" diff --cached --quiet; then
            echo "No Pages changes to publish."
          else
            git -C "$PUBLISH_DIR" commit -m "Publish Aurora site"
            git -C "$PUBLISH_DIR" push origin gh-pages
          fi
