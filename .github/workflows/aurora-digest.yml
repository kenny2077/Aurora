name: aurora-digest

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Aurora mode to run
        default: unified_digest
        type: choice
        options:
          - tech_news
          - scholar
          - repo_learning
          - unified_digest
          - all
      dry_run:
        description: Run without live sources
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_llm:
        description: Skip optional LLM enrichment for faster Pages publishing
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --dev
      - name: Validate config
        run: uv run aurora config validate
      - name: Run Aurora
        timeout-minutes: 25
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          AURORA_EMAIL_RECIPIENTS: ${{ secrets.AURORA_EMAIL_RECIPIENTS }}
        run: |
          MODE="${{ github.event.inputs.mode || 'unified_digest' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          SKIP_LLM="${{ github.event.inputs.skip_llm || 'true' }}"
          ARGS=(--mode "$MODE")
          if [ "$SKIP_LLM" = "true" ]; then
            ARGS+=(--skip-llm)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            uv run aurora run --dry-run "${ARGS[@]}"
          else
            uv run aurora run "${ARGS[@]}" --strict-delivery
          fi
      - name: Verify generated Pages site
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          test -s site/index.md
          test -s site/_config.yml
          test -s site/feed.xml
          test -d site/_posts
          POST_COUNT="$(find site/_posts -type f -name '*.md' | wc -l)"
          if [ "$POST_COUNT" -lt 1 ]; then
            echo "No digest posts were generated under site/_posts."
            exit 1
          fi
      - name: Upload generated site
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: aurora-site
          path: site
          if-no-files-found: error
      - name: Upload dry-run outputs
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: aurora-dry-run
          path: data/runs
          if-no-files-found: error

  publish-pages:
    needs: build-site
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: aurora-site
          path: site
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true
