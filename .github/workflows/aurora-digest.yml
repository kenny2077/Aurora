name: aurora-digest

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Aurora mode to run
        default: unified_digest
        type: choice
        options:
          - tech_news
          - scholar
          - repo_learning
          - unified_digest
          - all
      dry_run:
        description: Run without live sources
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  aurora:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: target
        run: uv sync --dev
      - name: Validate config
        working-directory: target
        run: uv run aurora config validate
      - name: Run Aurora
        working-directory: target
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          AURORA_EMAIL_RECIPIENTS: ${{ secrets.AURORA_EMAIL_RECIPIENTS }}
        run: |
          MODE="${{ github.event.inputs.mode || 'unified_digest' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY_RUN" = "true" ]; then
            uv run aurora run --dry-run --mode "$MODE"
          else
            uv run aurora run --mode "$MODE"
          fi
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site
