name: dependency-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * 1"
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - web/package.json
      - web/package-lock.json
      - .github/workflows/dependency-audit.yml
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - web/package.json
      - web/package-lock.json
      - .github/workflows/dependency-audit.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install uv
        run: |
          python -m pip install --user "uv==0.11.15"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Audit locked dependencies
        run: |
          REQ_FILE="$(mktemp)"
          uv export --locked --dev --format requirements-txt --no-hashes > "$REQ_FILE"
          timeout 90s uvx --from pip-audit pip-audit -r "$REQ_FILE" --no-deps --timeout 10
          rm "$REQ_FILE"

  web:
    name: Audit web dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit locked dependencies
        run: |
          AUDIT_REPORT="$(mktemp)"
          for ATTEMPT in 1 2; do
            if timeout 90s npm --prefix web audit --audit-level=high --registry=https://registry.npmjs.org --json > "$AUDIT_REPORT"; then
              cat "$AUDIT_REPORT"
              exit 0
            else
              STATUS=$?
            fi
            cat "$AUDIT_REPORT"
            if jq -e '(.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical) > 0' "$AUDIT_REPORT" >/dev/null 2>&1; then
              exit "$STATUS"
            fi
            if [ "$ATTEMPT" -eq 2 ]; then
              exit "$STATUS"
            fi
            echo "npm audit transport failed; retrying once."
          done
